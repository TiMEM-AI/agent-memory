name: Site Monitor

on:
  schedule:
    - cron: '0 2 * * *' # ежедневно в 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Check production site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run site checks
        run: |
          python3 .zcode/skills/site-monitor/scripts/check_site.py \
            --config .zcode/skills/site-monitor/site-monitor.json \
            --only-errors | tee monitor-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-monitor-report
          path: monitor-report.txt
          retention-days: 30
